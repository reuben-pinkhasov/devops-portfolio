name: CD - Deploy to EKS

on:
  workflow_run:
    workflows:
      - CI - Playwright + Docker + ECR
    types:
      - completed

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: devops-portfolio-eks
  ECR_REGISTRY: 949948071592.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY: devops-portfolio-app
  NAMESPACE: devops-demo
  RELEASE_NAME: myapp

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact CI commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify image exists in ECR
        run: |
          echo "Checking ECR image:"
          echo "$ECR_REGISTRY/$ECR_REPOSITORY:${{ github.event.workflow_run.head_sha }}"

          aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --region "$AWS_REGION" \
            --image-ids imageTag="${{ github.event.workflow_run.head_sha }}"

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Deploy with Helm
        run: |
          helm upgrade --install "$RELEASE_NAME" ./helm/myapp \
            --namespace "$NAMESPACE" \
            --create-namespace \
            --set image.repository="$ECR_REGISTRY/$ECR_REPOSITORY" \
            --set image.tag="${{ github.event.workflow_run.head_sha }}"

      - name: Verify deployment
        run: |
          kubectl rollout status \
            deployment/"$RELEASE_NAME" \
            -n "$NAMESPACE" \
            --timeout=180s

          kubectl get pods -n "$NAMESPACE"

      - name: Show deployed image
        run: |
          echo "Deployed image:"
          kubectl get deployment "$RELEASE_NAME" \
            -n "$NAMESPACE" \
            -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'
