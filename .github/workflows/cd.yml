name: CD - Deploy to EKS

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag to deploy"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: devops-portfolio-eks
  ECR_REGISTRY: 949948071592.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY: devops-portfolio-app
  NAMESPACE: devops-demo
  RELEASE_NAME: myapp

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout deployment configuration
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify image exists in ECR
        run: |
          echo "Checking ECR image:"
          echo "$ECR_REGISTRY/$ECR_REPOSITORY:${{ inputs.image_tag }}"

          aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --region "$AWS_REGION" \
            --image-ids imageTag="${{ inputs.image_tag }}"

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Deploy with Helm
        run: |
          helm upgrade --install "$RELEASE_NAME" ./helm/myapp \
            --namespace "$NAMESPACE" \
            --create-namespace \
            --set image.repository="$ECR_REGISTRY/$ECR_REPOSITORY" \
            --set image.tag="${{ inputs.image_tag }}"

      - name: Verify deployment
        run: |
          kubectl rollout status \
            deployment/"$RELEASE_NAME" \
            -n "$NAMESPACE" \
            --timeout=180s

          kubectl get pods -n "$NAMESPACE"

      - name: Show deployed image
        run: |
          echo "Deployed image:"
          kubectl get deployment "$RELEASE_NAME" \
            -n "$NAMESPACE" \
            -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'