apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ include "myapp.fullname" . }}

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: {{ include "myapp.name" . }}

  template:
    metadata:
      labels:
        app: {{ include "myapp.name" . }}

    spec:
      containers:
        - name: nginx
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"

          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: 50m
              memory: 64Mi

            limits:
              cpu: 100m
              memory: 128Mi
